<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Paper Weights - Sentences</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="competitive.css"><link rel="stylesheet" href="sentences.css"></head>
<body><main><header class="bar"><span class="title">PAPER WEIGHTS</span><div class="controls"><select id="people" aria-label="Number of sheets"><option value="15">15 sheets</option><option value="100">100 sheets</option><option value="200" selected>200 sheets</option></select><select id="scenario" aria-label="Scenario"><option value="rover">Rover</option><option value="households">Households</option><option value="sentences" selected>Sentences</option></select><select id="opening" aria-label="Starting word and color"></select><button id="reset">Reset</button><button id="theme">Light</button></div></header>
<section class="sentence-panel" aria-label="Generated sentence"><div id="sentence" aria-live="polite"></div></section>
<section class="word-controls"><div class="lookup"><span id="cue-color"></span><strong id="cue-word"></strong></div><div class="actions"><button id="next">Next word</button><label for="voters">Voters<input id="voters" type="number" min="1" max="200" step="1" placeholder="All matching" aria-label="Maximum matching voters for majority"></label><button id="majority">Majority word</button></div></section>
<p id="status" role="status"></p>
<details id="audit"><summary>Last draw</summary><div id="audit-body"></div></details>
<p class="source">Authored open word corpus - votes from actual sheet rows</p><p id="error" role="alert"></p></main><script type="module" src="sentences.js"></script></body></html>

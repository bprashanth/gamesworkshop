<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Households - paper study</title><link rel="stylesheet" href="style.css"></head><body class="paper"><main><header><h1>Paper Weights / Households</h1><a href="index.html">Cards</a></header><div class="instructions">1 Match the icon + color.<br>2 Vote the answer on the right.<br>3 Follow the next call.</div><section id="lookups" class="lookup-grid"></section><p class="paper-note">VISUAL STUDY - SAMPLE ANSWERS, NOT GENERATED GAME DATA</p></main><script type="module">
const data=await(await fetch('assets/icons.json')).json();
const rows=[['harvest','weak','red','CASH'],['harvest','weak','blue','SKIP'],['cash','low','amber','ATTENDANCE'],['cash','loan','green','SKIP'],['attendance','irregular','purple','CASH'],['attendance','irregular','pink','CASH'],['weather','storm','red','HARVEST'],['weather','rain','blue','SKIP'],['harvest','failed','amber','CASH'],['cash','enough','green','SKIP'],['attendance','regular','purple','HARVEST'],['weather','sun','pink','CASH']];
document.querySelector('#lookups').innerHTML=rows.map(([cat,state,color,answer])=>`<div class="lookup"><div class="left" style="--context:var(--${color})"><span>${color.toUpperCase()}</span>${data.primary[cat][state]}</div><span class="arrow">-&gt;</span><span class="answer">${answer}</span></div>`).join('');
</script></body></html>

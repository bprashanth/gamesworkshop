<!doctype html><meta charset="utf-8"><title>Moon glyphs</title><link rel="stylesheet" href="style.css">
<style>body{padding:20px} .row{display:flex;gap:6px;margin:6px 0;align-items:center} .row b{width:90px;font-weight:400;color:#8a8a86;font-size:12px} .card{width:62px} .big .sym{width:120px;height:90px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round} .big .sym .fill{fill:currentColor;stroke:none} .big .sym .thin{stroke-width:1} .big .sym .hair{stroke-width:.7} .big .sym .faint{stroke-opacity:.55} .big{display:flex;gap:20px;flex-wrap:wrap;margin-top:20px;color:#e6e6e1}</style>
<div id="g"></div><div class="big" id="b"></div>
<script type="module">
import { SYMBOLS } from './symbols.js';
const g = document.getElementById('g'), b = document.getElementById('b');
for (const [k, vs] of Object.entries(SYMBOLS)) {
  g.innerHTML += `<div class="row"><b>${k}</b>${Object.entries(vs).map(([v, s]) => `<div class="card up ${k === 'outcome' && v !== 'safe' ? 'hazard' : ''}">${s}<i>${v}</i></div>`).join('')}</div>`;
  b.innerHTML += Object.values(vs).join('');
}
</script>

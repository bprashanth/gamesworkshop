<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RULES · Moon Run</title>
<link rel="stylesheet" href="style.css"><link rel="stylesheet" href="moon.css"><link rel="stylesheet" href="pages.css">
</head>
<body>
<main class="page">
  <header class="bar"><h1 id="place">RULES: south pole, Moon</h1>
    <span class="controls"><input id="who" class="b" placeholder="A01" maxlength="3" aria-label="your card number"><button class="b" id="whoGo">Open</button></span>
    <nav><a href="stage.html">Stage</a><a href="archive.html">Archive</a><a href="rules.html" class="on">Rules</a><a href="model.html">Model</a><a href="index.html">Board</a><a href="sudden.html">Sudden death</a></nav>
  </header>
  <div class="cols">
    <div>
      <h2 id="fragH">your piece of the archive</h2>
      <div id="frag" class="hists"></div>
      <p class="q">Start from a white square. Look backwards. What came before it?</p>
      <h2>your rule</h2>
      <div class="tabs" id="tabs"><button data-t="before">BEFORE</button><button data-t="persists">PERSISTS</button><button data-t="with">WITH</button></div>
      <p class="q" id="question"></p>
      <div class="sentence" id="sentence"></div>
      <div id="picker"></div>
      <p><button class="b" id="eval" disabled>Evaluate</button> <span class="dim small" id="evalNote">tests your rule on every history in the archive, not just yours</span></p>
    </div>
    <div>
      <h2>verification</h2>
      <div class="result" id="result"><span class="dim">Build a rule, then press Evaluate.</span></div>
      <p><button class="b" id="publish" hidden>Publish to my representative</button> <span id="pubNote" class="dim small"></span></p>
      <h2>your tries</h2>
      <ol class="tries" id="tries"></ol>
    </div>
  </div>
</main>
<script type="module" src="rules.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MAP · Rover Run</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="layout">
  <header class="bar"><h1 id="place">MAP: Jezero crater, Mars</h1><span id="controls" class="controls"></span><span id="status"></span><span id="lives" class="lives"></span><span class="controls"><button id="reset">Reset</button></span></header>
  <div class="modes" id="modes"><button data-mode="easy">Easy</button><button data-mode="medium">Medium</button><button data-mode="hard">Hard</button></div>
  <div class="screen"><canvas id="screen"></canvas></div>
  <aside class="side mapside"></aside>
  <div class="panel"><div id="cards" class="cards"></div></div>
  <aside class="side"><table class="key" id="key"></table></aside>
  <div class="panel"><div id="graph" class="graph"></div></div>
  <aside class="side graphside">
    <p><svg width="30" height="10"><line x1="1" y1="5" x2="29" y2="5" stroke="currentColor" stroke-width="2"/></svg> battery <b id="batnow"></b></p>
    <p><svg width="30" height="10"><rect x="1" y="2" width="28" height="8" fill="#3a3a38"/></svg> slope</p>
    <p><svg width="30" height="10"><line x1="1" y1="5" x2="29" y2="5" stroke="currentColor" stroke-width="1.3" stroke-dasharray="1.5 3"/><circle cx="15" cy="5" r="2.2" fill="currentColor"/></svg> ground</p>
    <p><svg width="30" height="10"><line x1="1" y1="5" x2="29" y2="5" stroke="currentColor" stroke-width="1.3" stroke-dasharray="5 3"/><path d="M12.5 2.5 l5 5 M17.5 2.5 l-5 5" stroke="currentColor" stroke-width="1.3"/></svg> dust</p>
    <p id="say" class="say"></p>
  </aside>
</main>
<script type="module" src="game.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DUNE//EATER</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <div class="screen"><canvas id="screen"></canvas></div>
  <div class="below">
    <div class="box cardsbox"><div id="cards"></div></div>
    <div class="box legendbox">
      <table>
        <tr><th></th><th></th><th>low</th><th>mid</th><th>high</th></tr>
        <tr><td><svg width="26" height="8"><line x1="1" y1="4" x2="25" y2="4" stroke="currentColor" stroke-width="1.3" stroke-dasharray=""/></svg></td><td>slope</td><td>flat</td><td>tilted</td><td>steep</td></tr>
        <tr><td><svg width="26" height="8"><line x1="1" y1="4" x2="25" y2="4" stroke="currentColor" stroke-width="1.3" stroke-dasharray="1 3"/></svg></td><td>ground</td><td>firm</td><td>soft</td><td>SAND ■</td></tr>
        <tr><td><svg width="26" height="8"><line x1="1" y1="4" x2="25" y2="4" stroke="currentColor" stroke-width="1.3" stroke-dasharray="5 3"/></svg></td><td>dust</td><td>clear</td><td>haze</td><td>STORM ■</td></tr>
        <tr><td><svg width="26" height="8"><line x1="1" y1="4" x2="25" y2="4" stroke="currentColor" stroke-width="1.3" stroke-dasharray="6 2 1 2"/></svg></td><td>battery</td><td>0</td><td>−1</td><td>– ■</td></tr>
      </table>
      <p>■ deadly to drive into · ▢ face down<br>● seen this run · ○ seen in an earlier run<br>battery card = what that square cost</p>
    </div>
  </div>
  <div id="pad" class="pad">
    <button data-k="none">·</button><button data-k="recharge">R +2</button><button data-k="sample">S +1</button>
    <span></span><button data-k="go">G go</button><button data-k="avoid">A avoid</button><button data-k="p" class="again">P play</button>
  </div>
</main>
<script type="module" src="game.js"></script>
</body>
</html>

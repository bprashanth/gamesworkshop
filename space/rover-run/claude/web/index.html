<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MARS · Rover Run</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header class="bar"><span id="place">MAP: Jezero crater, Mars</span><span id="controls" class="controls"></span><span id="status"></span></header>
  <div class="screen"><canvas id="screen"></canvas></div>
  <div class="panel">
    <div id="graph" class="body graph"></div>
    <div class="side">
      <p><svg width="30" height="8"><line x1="1" y1="4" x2="29" y2="4" stroke="currentColor" stroke-width="1.8" stroke-dasharray=""/></svg> battery <b id="batnow"></b></p>
      <p><svg width="30" height="8"></svg> turns left <b id="turnsnow"></b></p>
      <p><svg width="30" height="8"><line x1="1" y1="4" x2="29" y2="4" stroke="currentColor" stroke-width="1.3" stroke-dasharray="7 3"/></svg> slope</p>
      <p><svg width="30" height="8"><line x1="1" y1="4" x2="29" y2="4" stroke="currentColor" stroke-width="1.3" stroke-dasharray="1.5 3"/></svg> ground</p>
      <p><svg width="30" height="8"><line x1="1" y1="4" x2="29" y2="4" stroke="currentColor" stroke-width="1.3" stroke-dasharray="5 2 1.5 2"/></svg> dust</p>
    </div>
  </div>
  <div class="panel">
    <div id="cards" class="body cards"></div>
    <div class="side"><table class="key" id="key"></table></div>
  </div>
</main>
<script type="module" src="game.js"></script>
</body>
</html>

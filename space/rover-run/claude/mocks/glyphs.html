<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Card glyph mocks</title>
<style>
:root { --ink: #e6e6e1; --dim: #8a8a86; }
html { background: #000; color: var(--ink); font: 13px "JetBrains Mono","DejaVu Sans Mono",ui-monospace,monospace; }
body { max-width: 1100px; margin: 28px auto; padding: 0 16px; }
h1 { font-weight: 400; font-size: 16px; } h2 { font-weight: 400; font-size: 13px; color: var(--dim); margin: 26px 0 10px; }
.row { display: flex; gap: 22px; flex-wrap: wrap; align-items: flex-end; }
.g { text-align: center; color: var(--dim); }
.big { width: 128px; height: 96px; border: 1px solid #222; border-radius: 4px; display: grid; place-items: center; color: var(--ink); margin-bottom: 6px; }
.big .sym { width: 112px; height: 84px; stroke-width: 1.4; }
.card { width: 64px; height: 50px; border: 1px solid #5a5a58; border-radius: 3px; display: grid; place-items: center; align-content: center; margin: 8px auto 0; color: var(--ink); }
.card .sym { width: 40px; height: 30px; stroke-width: 1.5; }
.card i { font-style: normal; font-size: 9.5px; }
.card.warn { border-color: var(--ink); }
.card.haz, .big.haz { background: var(--ink); color: #000; }
.sym { fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; }
.sym .thin { stroke-width: .9; } .sym .hair { stroke-width: .6; } .sym .faint { stroke-opacity: .5; }
.opt { color: var(--ink); }
</style>
<h1>Card glyph mocks</h1>
<p style="color:var(--dim)">Each glyph is shown large and at card size. Options are labelled A / B where there is a choice.</p>
<div id="out"></div>
<script type="module">
import { DRAFT } from './glyphs.js';
const sets = [
  ['ground', [['firm', 'firm'], ['soft', 'soft'], ['sand', 'SAND', true]]],
  ['dust', [['clear', 'clear'], ['hazeA', 'haze', false, 'A rain'], ['hazeB', 'haze', false, 'B cross-hatch'], ['stormA', 'STORM', true, 'A whirlwind'], ['stormB', 'STORM', true, 'B spiral']]],
  ['slope', [['flat', 'flat'], ['slope', 'slope'], ['steep', 'steep']]],
];
document.getElementById('out').innerHTML = sets.map(([suit, items]) => `<h2>${suit}</h2><div class="row">${items.map(([k, word, haz, opt]) => `
  <div class="g"><div class="big">${DRAFT[suit][k]}</div>${opt ? `<span class="opt">${opt}</span>` : '&nbsp;'}
  <div class="card ${haz ? 'haz' : ['soft', 'haze'].includes(word) ? 'warn' : ''}">${DRAFT[suit][k]}<i>${word}</i></div></div>`).join('')}</div>`).join('');
</script>
